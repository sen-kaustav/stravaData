name: Daily Swim Data Update

on:
  schedule:
    - cron: "30 20 * * *" # Runs daily at 8:30 PM UTC
  workflow_dispatch: # Allows manual triggering
jobs:
  update-swim-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install required build dependencies for packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libjpeg-dev \
            libpng-dev \
            libcurl4-openssl-dev \
            libudunits2-dev \
            libjq-dev \
            gdal-bin \
            libgdal-dev \
            pkg-config

      - name: Set up R package dependencies (with cache)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            httr
            rStrava
            dplyr
            readr

      - name: Run swim data script
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: Rscript get_swim_data.R

      - name: Write last refreshed timestamp file (UTC)
        run: |
          # Create/overwrite a file at repo root with an ISO 8601 UTC timestamp
          echo "Last refreshed (UTC): $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > data_last_refreshed.txt
          # Optional: show the content for debugging
          cat data_last_refreshed.txt

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add swim_data.csv data_last_refreshed.txt
          git commit -m "Update swim data" || echo "No changes to commit"
          git push
